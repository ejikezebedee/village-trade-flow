name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Supabase CLI
        run: |
          npm install -g supabase@latest
          
      - name: Generate Supabase Types
        run: npm run db:types
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          
      - name: Check Type Drift
        run: npm run db:types:check
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          
      - name: Check Migration Discipline
        run: npm run db:migrations:check
        
      - name: Security Function Check
        run: npm run security:check
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
      - name: Final Security Verification
        run: node scripts/final-security-verification.cjs
        env:
          SUPABASE_URL: https://zrsdcbqqeyoipzjlasjv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        
      - name: Lint
        run: npm run lint
        
      - name: Type Check
        run: npm run typecheck
        
      - name: Run Tests
        run: npm test -- --runInBand --passWithNoTests
        env:
          CI: true
          
      - name: Security Audit
        run: npm audit --audit-level=high || true
        
      - name: OWASP ZAP Baseline Scan
        if: github.event_name == 'pull_request'
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
        continue-on-error: true
        
      - name: Build Application
        run: npm run build
        env:
          CI: true

      - name: Check for default admin credentials
        run: node scripts/check-default-admin.cjs

      - name: Run security verification
        run: node scripts/security-verification-checklist.cjs